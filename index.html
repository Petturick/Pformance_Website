<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FAF7F3" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Pformance verbindt marketingstrategie, technologie en uitvoering in schaalbare commerciële systemen die groei, grip en uitvoering versterken." />
    <meta name="robots" content="index, follow" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Pformance" />
    <meta property="og:title" content="Pformance | Van commerciële marketinguitdaging naar groeisysteem" />
    <meta property="og:description" content="Marketingstrategie, technologie en uitvoering verbonden in één schaalbaar commercieel systeem." />
    <meta property="og:url" content="https://pformance.nl/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Pformance | Van commerciële marketinguitdaging naar groeisysteem" />
    <meta name="twitter:description" content="Marketingstrategie, technologie en uitvoering verbonden in één schaalbaar commercieel systeem." />
    <link rel="canonical" href="https://pformance.nl/" />
    <link rel="icon" type="image/svg+xml" href="/pformance-mark-official.svg" />
    <link rel="apple-touch-icon" href="/pformance-mark-official.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
    <script>
      (() => {
        try {
          const stored = localStorage.getItem('pformance_theme_preference') || 'auto';
          const hour = new Date().getHours();
          const theme = stored === 'dark' || (stored === 'auto' && (hour >= 19 || hour < 7)) ? 'dark' : 'light';
          document.documentElement.dataset.theme = theme;
          document.documentElement.dataset.themePreference = stored;
          document.documentElement.style.colorScheme = theme;
        } catch (_) {}
      })();
    </script>
    <title>Pformance | Van commerciële marketinguitdaging naar groeisysteem</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
